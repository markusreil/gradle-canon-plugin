# Minimal detekt config: detekt defaults plus KDoc enforcement on public API.
# Test classes need a short class doc too (what the class proves); test functions and
# properties stay exempt.

comments:
  UndocumentedPublicClass:
    active: true
    searchInNestedClass: false
  UndocumentedPublicFunction:
    active: true
    excludes: ['**/src/test/**', '**/src/functionalTest/**']
  UndocumentedPublicProperty:
    active: true
    excludes: ['**/src/test/**', '**/src/functionalTest/**']
